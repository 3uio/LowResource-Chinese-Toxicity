# ============================================================
# 模式 ③：MAD-X（语言适配器 + 任务适配器 两层叠加）
# 冻结底座 + 冻结语言适配器，只训练任务适配器
# 语言适配器用现成的（AdapterHub 下载的中文 LA），不用自己训
#
# 本文件 = 「不交替」的原版形式（tlr: false）：
#   训练与推理全程都用目标语言 LA（中文）。
# 若要做 TLR（训练时在英语/中文语言适配器之间轮换），改用 madx_tlr.yaml。
# ============================================================

exp_name: madx
mode: madx                    # ← 切换模式就改这一行

# ---- 模型 ----
backbone: .model_cache/xlm-roberta-base
language_adapter: .model_cache/xlm-roberta-base-zh-wiki_pfeiffer   # 目标语言层（中文）
tlr: false                    # 不交替（原版形式）
task_adapter_name: task
reduction_factor: 16
num_labels: 2
head_name: toxic

# ---- 数据 ----
train_file: 框架开发/data/demo_train.jsonl
dev_file: 框架开发/data/demo_dev.jsonl

max_length: 64

# ---- 训练 ----
epochs: 2
batch_size: 4
learning_rate: 1.0e-4
seed: 42
cpu: true

# ---- 输出 ----
runs_dir: runs
