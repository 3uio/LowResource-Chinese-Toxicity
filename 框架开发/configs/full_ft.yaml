# ============================================================
# 模式 ①：全参数微调（V2 三条微调分支里的「主基线」）
# 底座 + 分类头全部参数都训练 —— 效果通常最好，但最贵、最容易过拟合
# ============================================================

exp_name: full_ft
mode: full_ft                 # ← 切换模式就改这一行

# ---- 模型 ----
backbone: .model_cache/xlm-roberta-base
num_labels: 2
head_name: toxic

# ---- 数据（jsonl，每行 {"text": "...", "label": 0/1}）----
train_file: 框架开发/data/demo_train.jsonl
dev_file: 框架开发/data/demo_dev.jsonl

max_length: 64

# ---- 训练 ----
epochs: 2
batch_size: 4
learning_rate: 1.0e-4
seed: 42
cpu: true                     # 本地 CPU 验证用；上服务器改 false

# ---- 输出 ----
runs_dir: runs
